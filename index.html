<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>건담 스타일 대전 - 구르기(Roll) 회피 시스템</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            color: white;
            font-weight: bold;
            pointer-events: none;
            font-size: 16px;
        }
        .bar-container {
            width: 180px;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #fff;
            border-radius: 10px;
            padding: 3px;
            margin-top: 5px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .bar {
            height: 16px;
            border-radius: 6px;
            transition: width 0.2s ease;
        }
        #player-hp { background: #2ecc71; width: 100%; }
        #ai-hp { background: #e74c3c; width: 100%; }

        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 30px;
            height: 30px;
            pointer-events: none;
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            box-sizing: border-box;
            transition: border-color 0.2s, transform 0.2s;
        }
        #crosshair.locked {
            border-color: #e74c3c;
            transform: translate(-50%, -50%) scale(1.2);
        }

        #controls-hint {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            background: rgba(0, 0, 0, 0.6);
            padding: 6px 16px;
            border-radius: 15px;
            font-size: 13px;
            pointer-events: none;
            text-align: center;
        }

        #touch-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        #joystick-area {
            position: absolute;
            bottom: 30px;
            left: 30px;
            width: 130px;
            height: 130px;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            pointer-events: auto;
            touch-action: none;
        }
        #joystick-stick {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 50px;
            height: 50px;
            margin-top: -25px;
            margin-left: -25px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
        }

        #action-buttons {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 260px;
            height: 220px;
            pointer-events: auto;
        }
        .touch-btn {
            position: absolute;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.5);
            color: white;
            font-weight: bold;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            user-select: none;
            touch-action: manipulation;
        }
        .touch-btn:active {
            background: rgba(255, 255, 255, 0.4);
        }

        /* 기동 버튼 */
        #btn-jump { width: 55px; height: 55px; bottom: 130px; right: 20px; background: rgba(52, 152, 219, 0.7); }
        #btn-roll { width: 55px; height: 55px; bottom: 65px; right: 20px; background: rgba(241, 196, 15, 0.7); }

        /* 공격/스킬 버튼 */
        #btn-q { width: 48px; height: 48px; bottom: 10px; right: 80px; background: rgba(231, 76, 60, 0.8); }
        #btn-w { width: 42px; height: 42px; bottom: 130px; right: 90px; }
        #btn-a { width: 42px; height: 42px; bottom: 75px; right: 145px; }
        #btn-s { width: 42px; height: 42px; bottom: 15px; right: 145px; }
        #btn-d { width: 42px; height: 42px; bottom: 75px; right: 85px; }

        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            text-align: center;
            background: rgba(0, 0, 0, 0.85);
            padding: 30px 50px;
            border-radius: 15px;
            display: none;
            border: 2px solid #fff;
            z-index: 20;
        }
        #game-over button {
            padding: 10px 25px;
            font-size: 16px;
            font-weight: bold;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="ui">
        <div>
            <div>PLAYER (GUNDAM)</div>
            <div class="bar-container"><div id="player-hp" class="bar"></div></div>
        </div>
        <div style="text-align: right;">
            <div>ENEMY</div>
            <div class="bar-container"><div id="ai-hp" class="bar"></div></div>
        </div>
    </div>

    <div id="crosshair"></div>

    <div id="controls-hint">
        <span id="target-status">화면을 드래그하여 시점을 전환하세요</span>
    </div>

    <div id="touch-controls">
        <div id="joystick-area">
            <div id="joystick-stick"></div>
        </div>
        <div id="action-buttons">
            <div class="touch-btn" id="btn-jump">JUMP</div>
            <div class="touch-btn" id="btn-roll">ROLL</div>
            <div class="touch-btn" id="btn-q">Q</div>
            <div class="touch-btn" id="btn-w">W</div>
            <div class="touch-btn" id="btn-a">A</div>
            <div class="touch-btn" id="btn-s">S</div>
            <div class="touch-btn" id="btn-d">D</div>
        </div>
    </div>

    <div id="game-over">
        <h1 id="result-text">게임 종료</h1>
        <button onclick="resetGame()">다시 시작</button>
    </div>

    <script>
        let scene, camera, renderer;
        let player, ai, targetRingMesh;
        let keys = {};
        let playerHP = 100, aiHP = 100;
        let isGameOver = false;

        let touchMoveX = 0, touchMoveZ = 0;

        // 카메라 변수
        let cameraYaw = 0;
        let cameraPitch = 0.2;
        let cameraDistance = 10.0;
        let isDraggingCamera = false;
        let previousMouseX = 0, previousMouseY = 0;

        let isEnemyInSight = false;
        let skillCooldown = 0, meleeCooldown = 0;
        let projectiles = [];

        // 물리 및 구르기(Roll) 상태 변수
        let playerVelocityY = 0;
        let isGrounded = true;
        let rollCooldown = 0;
        let isRolling = false;
        let rollTimer = 0;
        let rollDir = new THREE.Vector3();

        // AI 상태 변수
        let aiVelocityY = 0;
        let aiIsGrounded = true;
        let aiActionTimer = 0;
        let aiMoveDir = new THREE.Vector3();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a24);
            scene.fog = new THREE.Fog(0x1a1a24, 15, 60);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
            dirLight.position.set(20, 40, 20);
            dirLight.castShadow = true;
            scene.add(dirLight);

            const floorGeo = new THREE.PlaneGeometry(60, 60);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x2c3e50, roughness: 0.8 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            const grid = new THREE.GridHelper(60, 30, 0x00ffff, 0x444444);
            grid.position.y = 0.01;
            scene.add(grid);

            const ringGeo = new THREE.RingGeometry(0.8, 1.0, 16);
            const ringMat = new THREE.MeshBasicMaterial({ color: 0xe74c3c, side: THREE.DoubleSide, transparent: true, opacity: 0.8 });
            targetRingMesh = new THREE.Mesh(ringGeo, ringMat);
            targetRingMesh.rotation.x = -Math.PI / 2;
            targetRingMesh.visible = false;
            scene.add(targetRingMesh);

            player = createCharacter(0x3498db, new THREE.Vector3(0, 0, 10));
            ai = createCharacter(0xe74c3c, new THREE.Vector3(0, 0, -10));

            window.addEventListener('mousedown', onPointerDown);
            window.addEventListener('mousemove', onPointerMove);
            window.addEventListener('mouseup', onPointerUp);

            window.addEventListener('touchstart', onTouchStart, { passive: false });
            window.addEventListener('touchmove', onTouchMove, { passive: false });
            window.addEventListener('touchend', onTouchEnd);

            window.addEventListener('keydown', e => keys[e.code] = true);
            window.addEventListener('keyup', e => keys[e.code] = false);
            window.addEventListener('resize', onWindowResize);

            initTouchControls();
            animate();
        }

        function createCharacter(color, position) {
            const group = new THREE.Group();

            const bodyGeo = new THREE.CylinderGeometry(0.5, 0.5, 1.6, 16);
            const bodyMat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.3 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.8;
            body.castShadow = true;
            group.add(body);

            const headGeo = new THREE.SphereGeometry(0.4, 16, 16);
            const headMat = new THREE.MeshStandardMaterial({ color: 0xffdbac });
            const head = new THREE.Mesh(headGeo, headMat);
            head.position.y = 1.8;
            head.castShadow = true;
            group.add(head);

            const eyeGeo = new THREE.BoxGeometry(0.3, 0.1, 0.2);
            const eyeMat = new THREE.MeshBasicMaterial({ color: 0x111111 });
            const eyes = new THREE.Mesh(eyeGeo, eyeMat);
            eyes.position.set(0, 1.85, 0.35);
            group.add(eyes);

            const swordGroup = new THREE.Group();
            const swordGeo = new THREE.BoxGeometry(0.1, 1.2, 0.1);
            const swordMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.8 });
            const sword = new THREE.Mesh(swordGeo, swordMat);
            sword.position.y = 0.6;
            swordGroup.add(sword);

            swordGroup.position.set(0.6, 0.8, 0.3);
            swordGroup.rotation.x = Math.PI / 4;
            group.add(swordGroup);

            group.position.copy(position);
            scene.add(group);

            group.userData = { swordGroup: swordGroup, bodyMesh: body };
            return group;
        }

        function onPointerDown(e) {
            if (e.clientX > window.innerWidth * 0.3 && e.clientY < window.innerHeight * 0.7) {
                isDraggingCamera = true;
                previousMouseX = e.clientX;
                previousMouseY = e.clientY;
            }
        }

        function onPointerMove(e) {
            if (!isDraggingCamera) return;
            const deltaX = e.clientX - previousMouseX;
            const deltaY = e.clientY - previousMouseY;

            cameraYaw -= deltaX * 0.005;
            cameraPitch = Math.max(-0.2, Math.min(0.8, cameraPitch + deltaY * 0.005));

            previousMouseX = e.clientX;
            previousMouseY = e.clientY;
        }

        function onPointerUp() { isDraggingCamera = false; }

        let cameraTouchId = null;
        function onTouchStart(e) {
            for (let touch of e.changedTouches) {
                if (touch.clientX > window.innerWidth * 0.35) {
                    cameraTouchId = touch.identifier;
                    previousMouseX = touch.clientX;
                    previousMouseY = touch.clientY;
                    break;
                }
            }
        }

        function onTouchMove(e) {
            for (let touch of e.changedTouches) {
                if (touch.identifier === cameraTouchId) {
                    const deltaX = touch.clientX - previousMouseX;
                    const deltaY = touch.clientY - previousMouseY;

                    cameraYaw -= deltaX * 0.005;
                    cameraPitch = Math.max(-0.2, Math.min(0.8, cameraPitch + deltaY * 0.005));

                    previousMouseX = touch.clientX;
                    previousMouseY = touch.clientY;
                    break;
                }
            }
        }

        function onTouchEnd(e) {
            for (let touch of e.changedTouches) {
                if (touch.identifier === cameraTouchId) cameraTouchId = null;
            }
        }

        function initTouchControls() {
            const joystickArea = document.getElementById('joystick-area');
            const joystickStick = document.getElementById('joystick-stick');
            let touchId = null;
            let center = { x: 0, y: 0 };

            joystickArea.addEventListener('touchstart', e => {
                const touch = e.changedTouches[0];
                touchId = touch.identifier;
                const rect = joystickArea.getBoundingClientRect();
                center = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
                updateJoystick(touch);
            });

            joystickArea.addEventListener('touchmove', e => {
                for (let touch of e.changedTouches) {
                    if (touch.identifier === touchId) {
                        updateJoystick(touch);
                        break;
                    }
                }
            });

            const resetJoystick = () => {
                touchId = null;
                touchMoveX = 0;
                touchMoveZ = 0;
                joystickStick.style.transform = `translate(0px, 0px)`;
            };

            joystickArea.addEventListener('touchend', resetJoystick);
            joystickArea.addEventListener('touchcancel', resetJoystick);

            function updateJoystick(touch) {
                const maxRadius = 45;
                let dx = touch.clientX - center.x;
                let dy = touch.clientY - center.y;
                let dist = Math.hypot(dx, dy);

                if (dist > maxRadius) {
                    dx = (dx / dist) * maxRadius;
                    dy = (dy / dist) * maxRadius;
                }

                joystickStick.style.transform = `translate(${dx}px, ${dy}px)`;
                touchMoveX = dx / maxRadius;
                touchMoveZ = dy / maxRadius;
            }

            const bindBtn = (id, keyName) => {
                const el = document.getElementById(id);
                el.addEventListener('touchstart', (e) => { e.preventDefault(); keys[keyName] = true; });
                el.addEventListener('touchend', (e) => { e.preventDefault(); keys[keyName] = false; });
            };

            bindBtn('btn-jump', 'Space');
            bindBtn('btn-roll', 'ShiftLeft');
            bindBtn('btn-q', 'KeyQ');
            bindBtn('btn-w', 'KeyW');
            bindBtn('btn-a', 'KeyA');
            bindBtn('btn-s', 'KeyS');
            bindBtn('btn-d', 'KeyD');
        }

        function checkEnemyOnScreen() {
            const targetPos = ai.position.clone();
            targetPos.y += 1.0;
            targetPos.project(camera);

            if (targetPos.z > 1.0) return false;
            return (Math.abs(targetPos.x) <= 0.85 && Math.abs(targetPos.y) <= 0.85);
        }

        function turnPlayerToTarget() {
            const dir = new THREE.Vector3().subVectors(ai.position, player.position);
            dir.y = 0;
            player.rotation.y = Math.atan2(dir.x, dir.z);
        }

        function updatePlayer() {
            if (isGameOver) return;

            // 오르빗 카메라 위치
            const camX = player.position.x + cameraDistance * Math.sin(cameraYaw) * Math.cos(cameraPitch);
            const camY = player.position.y + cameraDistance * Math.sin(cameraPitch) + 2.0;
            const camZ = player.position.z + cameraDistance * Math.cos(cameraYaw) * Math.cos(cameraPitch);

            camera.position.set(camX, camY, camZ);
            camera.lookAt(player.position.x, player.position.y + 1.2, player.position.z);

            // 적 록온 판정
            isEnemyInSight = checkEnemyOnScreen();
            const crosshair = document.getElementById('crosshair');
            const targetStatus = document.getElementById('target-status');

            if (isEnemyInSight) {
                crosshair.classList.add('locked');
                targetStatus.innerText = "LOCK-ON (적 포착됨)";
                targetStatus.style.color = "#e74c3c";
                targetRingMesh.visible = true;
                targetRingMesh.position.set(ai.position.x, 0.03, ai.position.z);
            } else {
                crosshair.classList.remove('locked');
                targetStatus.innerText = "화면을 드래그하여 시점을 전환하세요";
                targetStatus.style.color = "#ffffff";
                targetRingMesh.visible = false;
            }

            // 점프 및 중력
            if (keys['Space'] && isGrounded && !isRolling) {
                playerVelocityY = 0.25;
                isGrounded = false;
            }

            player.position.y += playerVelocityY;
            if (!isGrounded) {
                playerVelocityY -= 0.012;
                if (player.position.y <= 0) {
                    player.position.y = 0;
                    playerVelocityY = 0;
                    isGrounded = true;
                }
            }

            // 구르기 (ROLL) 시작 로직
            if (keys['ShiftLeft'] && rollCooldown <= 0 && isGrounded && !isRolling) {
                isRolling = true;
                rollTimer = 18; // 구르기 지속 프레임 수
                rollCooldown = 40; // 쿨타임

                // 구를 방향 설정
                let inputX = touchMoveX;
                let inputZ = touchMoveZ;
                if (keys['ArrowUp'] || keys['KeyW_Move']) inputZ -= 1;
                if (keys['ArrowDown'] || keys['KeyS_Move']) inputZ += 1;
                if (keys['ArrowLeft'] || keys['KeyA_Move']) inputX -= 1;
                if (keys['ArrowRight'] || keys['KeyD_Move']) inputX += 1;

                const camForward = new THREE.Vector3(-Math.sin(cameraYaw), 0, -Math.cos(cameraYaw)).normalize();
                const camRight = new THREE.Vector3(Math.cos(cameraYaw), 0, -Math.sin(cameraYaw)).normalize();

                if (Math.abs(inputX) > 0.05 || Math.abs(inputZ) > 0.05) {
                    rollDir.set(0, 0, 0)
                        .addScaledVector(camRight, inputX)
                        .addScaledVector(camForward, -inputZ)
                        .normalize();
                } else {
                    // 입력이 없으면 플레이어가 전방을 바라보는 방향으로 구르기
                    rollDir.set(0, 0, 1).applyQuaternion(player.quaternion).normalize();
                }

                player.rotation.y = Math.atan2(rollDir.x, rollDir.z);
            }

            if (rollCooldown > 0) rollCooldown--;

            // 구르기 애니메이션 및 이동 처리
            if (isRolling) {
                rollTimer--;
                player.position.addScaledVector(rollDir, 0.35); // 빠른 회피 이동 속도
                player.rotation.x += (Math.PI * 2) / 18; // 360도 회전 회파 동작

                if (rollTimer <= 0) {
                    isRolling = false;
                    player.rotation.x = 0; // 회전 복원
                }
            } else {
                // 일반 이동 처리
                let inputX = touchMoveX;
                let inputZ = touchMoveZ;

                if (keys['ArrowUp'] || keys['KeyW_Move']) inputZ -= 1;
                if (keys['ArrowDown'] || keys['KeyS_Move']) inputZ += 1;
                if (keys['ArrowLeft'] || keys['KeyA_Move']) inputX -= 1;
                if (keys['ArrowRight'] || keys['KeyD_Move']) inputX += 1;

                if (Math.abs(inputX) > 0.05 || Math.abs(inputZ) > 0.05) {
                    const speed = 0.16;

                    const camForward = new THREE.Vector3(-Math.sin(cameraYaw), 0, -Math.cos(cameraYaw)).normalize();
                    const camRight = new THREE.Vector3(Math.cos(cameraYaw), 0, -Math.sin(cameraYaw)).normalize();

                    const moveVector = new THREE.Vector3()
                        .addScaledVector(camRight, inputX)
                        .addScaledVector(camForward, -inputZ)
                        .normalize();

                    player.position.addScaledVector(moveVector, speed);
                    player.rotation.y = Math.atan2(moveVector.x, moveVector.z);
                }
            }

            // 공격 (구르기 중 공격 불가)
            if (!isRolling) {
                if (keys['KeyQ'] && meleeCooldown <= 0) {
                    if (isEnemyInSight) turnPlayerToTarget();
                    meleeCooldown = 20;
                    player.userData.swordGroup.rotation.x = -Math.PI / 2;
                    if (player.position.distanceTo(ai.position) < 2.5) applyDamageToAI(15);
                }
                if (meleeCooldown > 0) {
                    meleeCooldown--;
                    if (meleeCooldown < 10) player.userData.swordGroup.rotation.x = Math.PI / 4;
                }

                if (skillCooldown <= 0) {
                    if (keys['KeyW']) triggerSkill('W');
                    else if (keys['KeyA']) triggerSkill('A');
                    else if (keys['KeyS']) triggerSkill('S');
                    else if (keys['KeyD']) triggerSkill('D');
                }
                if (skillCooldown > 0) skillCooldown--;
            }
        }

        function triggerSkill(type) {
            if (isEnemyInSight) turnPlayerToTarget();

            const fireDir = new THREE.Vector3(0, 0, 1).applyQuaternion(player.quaternion);

            if (type === 'W') {
                skillCooldown = 15;
                spawnProjectile(player.position, fireDir, 0.5, 0.3, 0xffa500, 15, 'player');
            } else if (type === 'A') {
                skillCooldown = 25;
                const leftDir = fireDir.clone().applyAxisAngle(new THREE.Vector3(0, 1, 0), 0.3);
                const rightDir = fireDir.clone().applyAxisAngle(new THREE.Vector3(0, 1, 0), -0.3);
                spawnProjectile(player.position, fireDir, 0.4, 0.25, 0x00ffff, 10, 'player');
                spawnProjectile(player.position, leftDir, 0.4, 0.25, 0x00ffff, 10, 'player');
                spawnProjectile(player.position, rightDir, 0.4, 0.25, 0x00ffff, 10, 'player');
            } else if (type === 'S') {
                skillCooldown = 30;
                spawnProjectile(player.position, fireDir, 0.25, 0.7, 0x9b59b6, 25, 'player');
            } else if (type === 'D') {
                skillCooldown = 25;
                spawnProjectile(player.position, fireDir, 0.45, 0.2, 0xffff00, 12, 'player');
            }
        }

        function spawnProjectile(position, direction, speed, size, color, damage, owner) {
            const geo = new THREE.SphereGeometry(size, 16, 16);
            const mat = new THREE.MeshBasicMaterial({ color: color });
            const mesh = new THREE.Mesh(geo, mat);

            mesh.position.copy(position);
            mesh.position.y += 1.0;
            scene.add(mesh);

            projectiles.push({
                mesh: mesh,
                dir: direction.clone().normalize(),
                speed: speed,
                radius: size,
                damage: damage,
                owner: owner,
                life: 120
            });
        }

        function updateProjectiles() {
            for (let i = projectiles.length - 1; i >= 0; i--) {
                const p = projectiles[i];
                p.mesh.position.addScaledVector(p.dir, p.speed);
                p.life--;

                let hit = false;
                if (p.owner === 'player' && p.mesh.position.distanceTo(ai.position) < p.radius + 0.6) {
                    applyDamageToAI(p.damage);
                    hit = true;
                } else if (p.owner === 'ai' && p.mesh.position.distanceTo(player.position) < p.radius + 0.6) {
                    applyDamageToPlayer(p.damage);
                    hit = true;
                }

                if (hit || p.life <= 0) {
                    scene.remove(p.mesh);
                    projectiles.splice(i, 1);
                }
            }
        }

        function applyDamageToAI(amount) {
            aiHP = Math.max(0, aiHP - amount);
            document.getElementById('ai-hp').style.width = aiHP + '%';
            if (aiHP <= 0) endGame('KO 승리!');
        }

        function applyDamageToPlayer(amount) {
            playerHP = Math.max(0, playerHP - amount);
            document.getElementById('player-hp').style.width = playerHP + '%';
            if (playerHP <= 0) endGame('KO 패배!');
        }

        function updateAI() {
            if (isGameOver) return;

            const dist = ai.position.distanceTo(player.position);
            const toPlayer = new THREE.Vector3().subVectors(player.position, ai.position).normalize();
            ai.rotation.y = Math.atan2(toPlayer.x, toPlayer.z);

            aiActionTimer++;

            if (aiActionTimer % 60 === 0) {
                const rand = Math.random();
                if (rand < 0.4) {
                    const perp = new THREE.Vector3(-toPlayer.z, 0, toPlayer.x);
                    aiMoveDir.copy(perp).multiplyScalar(Math.random() > 0.5 ? 1 : -1);
                } else if (rand < 0.7) {
                    aiMoveDir.copy(toPlayer).multiplyScalar(dist > 5 ? 1 : -0.8);
                } else {
                    if (aiIsGrounded) {
                        aiVelocityY = 0.22;
                        aiIsGrounded = false;
                    }
                }
            }

            ai.position.addScaledVector(aiMoveDir, 0.08);

            ai.position.y += aiVelocityY;
            if (!aiIsGrounded) {
                aiVelocityY -= 0.012;
                if (ai.position.y <= 0) {
                    ai.position.y = 0;
                    aiVelocityY = 0;
                    aiIsGrounded = true;
                }
            }

            if (aiActionTimer % 90 === 0) {
                spawnProjectile(ai.position, toPlayer, 0.35, 0.3, 0xff0055, 8, 'ai');
            }
        }

        function endGame(message) {
            isGameOver = true;
            document.getElementById('result-text').innerText = message;
            document.getElementById('game-over').style.display = 'block';
        }

        function resetGame() {
            playerHP = 100; aiHP = 100; isGameOver = false;
            document.getElementById('player-hp').style.width = '100%';
            document.getElementById('ai-hp').style.width = '100%';
            document.getElementById('game-over').style.display = 'none';

            player.position.set(0, 0, 10);
            ai.position.set(0, 0, -10);

            projectiles.forEach(p => scene.remove(p.mesh));
            projectiles = [];
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            updatePlayer();
            updateAI();
            updateProjectiles();
            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
</html>
