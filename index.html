<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 3인칭 AI 대전 게임 - 타겟 시선 고정 버전</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            user-select: none;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            color: white;
            font-weight: bold;
            pointer-events: none;
            font-size: 16px;
        }
        .bar-container {
            width: 220px;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #fff;
            border-radius: 10px;
            padding: 3px;
            margin-top: 5px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .bar {
            height: 20px;
            border-radius: 6px;
            transition: width 0.2s ease;
        }
        #player-hp { background: #2ecc71; width: 100%; }
        #ai-hp { background: #e74c3c; width: 100%; }
        
        .charge-status {
            font-size: 13px;
            margin-top: 6px;
            color: #f1c40f;
        }

        #controls-hint {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            background: rgba(0, 0, 0, 0.85);
            padding: 12px 24px;
            border-radius: 20px;
            font-size: 14px;
            pointer-events: none;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
            line-height: 1.5;
        }
        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            text-align: center;
            background: rgba(0, 0, 0, 0.85);
            padding: 30px 50px;
            border-radius: 15px;
            display: none;
            border: 2px solid #fff;
        }
        #game-over h1 { margin: 0 0 20px 0; font-size: 32px; }
        #game-over button {
            padding: 10px 25px;
            font-size: 16px;
            font-weight: bold;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        #game-over button:hover { background: #2980b9; }
    </style>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="ui">
        <div>
            <div>플레이어 (BLUE)</div>
            <div class="bar-container"><div id="player-hp" class="bar"></div></div>
            <div class="charge-status">
                점프 스택: <span id="jump-count">2 / 2</span> <span id="jump-cd"></span><br>
                회피 스택: <span id="dodge-count">2 / 2</span> <span id="dodge-cd"></span>
            </div>
        </div>
        <div style="text-align: right;">
            <div>AI 적 (RED)</div>
            <div class="bar-container"><div id="ai-hp" class="bar"></div></div>
        </div>
    </div>

    <div id="controls-hint">
        <b>이동:</b> 방향키 (시선 상대 고정) | <b>점프:</b> Space (3초 쿨) | <b>회피:</b> Shift (5초 쿨) | <b>근접공격:</b> Q<br>
        <b>상대 자동조준 투사체:</b> [W] 파이어볼 | [A] 3방향 샷 | [S] 대형 에너지볼 | [D] 연사 샷
    </div>

    <div id="game-over">
        <h1 id="result-text">게임 종료</h1>
        <button onclick="resetGame()">다시 시작</button>
    </div>

    <script>
        let scene, camera, renderer;
        let player, ai;
        let keys = {};
        let playerHP = 100, aiHP = 100;
        let isGameOver = false;

        // 피지컬 변수
        let playerVelocityY = 0;
        let isJumping = false;
        let isDodging = false;
        let dodgeTimer = 0;
        let dodgeDir = new THREE.Vector3(0, 0, -1);
        let isInvincible = false;

        // 스택 & 쿨타임 시스템
        let jumpTimestamps = [];
        let dodgeTimestamps = [];
        const JUMP_COOLDOWN_MS = 3000;   // 점프 쿨타임 3초
        const DODGE_COOLDOWN_MS = 5000;  // 회피 쿨타임 5초

        let spacePressedLastFrame = false;
        let shiftPressedLastFrame = false;

        // 공격 및 투사체 관리
        let skillCooldown = 0;
        let meleeCooldown = 0;
        let aiAttackCooldown = 0;
        let aiAttacking = false;
        let projectiles = [];

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a24);
            scene.fog = new THREE.Fog(0x1a1a24, 10, 45);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(20, 40, 20);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            scene.add(dirLight);

            const floorGeo = new THREE.PlaneGeometry(40, 40);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x2c3e50, roughness: 0.8 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            const grid = new THREE.GridHelper(40, 20, 0x00ffff, 0x444444);
            grid.position.y = 0.01;
            scene.add(grid);

            player = createCharacter(0x3498db, new THREE.Vector3(0, 0, 10));
            ai = createCharacter(0xe74c3c, new THREE.Vector3(0, 0, -10));

            window.addEventListener('keydown', e => keys[e.code] = true);
            window.addEventListener('keyup', e => keys[e.code] = false);
            window.addEventListener('resize', onWindowResize);

            animate();
        }

        function createCharacter(color, position) {
            const group = new THREE.Group();

            const bodyGeo = new THREE.CylinderGeometry(0.5, 0.5, 1.6, 16);
            const bodyMat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.3 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.8;
            body.castShadow = true;
            group.add(body);

            const headGeo = new THREE.SphereGeometry(0.4, 16, 16);
            const headMat = new THREE.MeshStandardMaterial({ color: 0xffdbac });
            const head = new THREE.Mesh(headGeo, headMat);
            head.position.y = 1.8;
            head.castShadow = true;
            group.add(head);

            const eyeGeo = new THREE.BoxGeometry(0.3, 0.1, 0.2);
            const eyeMat = new THREE.MeshBasicMaterial({ color: 0x111111 });
            const eyes = new THREE.Mesh(eyeGeo, eyeMat);
            eyes.position.set(0, 1.85, 0.35);
            group.add(eyes);

            const swordGroup = new THREE.Group();
            const swordGeo = new THREE.BoxGeometry(0.1, 1.2, 0.1);
            const swordMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.8 });
            const sword = new THREE.Mesh(swordGeo, swordMat);
            sword.position.y = 0.6;
            swordGroup.add(sword);

            swordGroup.position.set(0.6, 0.8, 0.3);
            swordGroup.rotation.x = Math.PI / 4;
            group.add(swordGroup);

            group.position.copy(position);
            scene.add(group);

            group.userData = { swordGroup: swordGroup, bodyMesh: body };
            return group;
        }

        // 상대방(AI)을 향하는 방향 벡터 계산
        function getDirToTarget() {
            const dir = new THREE.Vector3().subVectors(ai.position, player.position);
            dir.y = 0; // 수평 기준
            return dir.normalize();
        }

        function getPlayerForward() {
            const forward = new THREE.Vector3(0, 0, 1);
            forward.applyQuaternion(player.quaternion);
            forward.y = 0;
            return forward.normalize();
        }

        // 투사체 생성
        function spawnProjectile(position, direction, speed, size, color, damage, owner) {
            const geo = new THREE.SphereGeometry(size, 16, 16);
            const mat = new THREE.MeshBasicMaterial({ color: color });
            const mesh = new THREE.Mesh(geo, mat);

            mesh.position.copy(position);
            mesh.position.y = 1.0;
            scene.add(mesh);

            projectiles.push({
                mesh: mesh,
                dir: direction.clone().normalize(),
                speed: speed,
                radius: size,
                damage: damage,
                owner: owner,
                life: 120
            });
        }

        function updateCooldowns() {
            const now = Date.now();

            jumpTimestamps = jumpTimestamps.filter(t => now - t < JUMP_COOLDOWN_MS);
            const availableJumps = 2 - jumpTimestamps.length;
            document.getElementById('jump-count').innerText = `${availableJumps} / 2`;
            if (jumpTimestamps.length > 0) {
                const oldestJump = jumpTimestamps[0];
                const remain = ((JUMP_COOLDOWN_MS - (now - oldestJump)) / 1000).toFixed(1);
                document.getElementById('jump-cd').innerText = `(${remain}초)`;
            } else {
                document.getElementById('jump-cd').innerText = '';
            }

            dodgeTimestamps = dodgeTimestamps.filter(t => now - t < DODGE_COOLDOWN_MS);
            const availableDodges = 2 - dodgeTimestamps.length;
            document.getElementById('dodge-count').innerText = `${availableDodges} / 2`;
            if (dodgeTimestamps.length > 0) {
                const oldestDodge = dodgeTimestamps[0];
                const remain = ((DODGE_COOLDOWN_MS - (now - oldestDodge)) / 1000).toFixed(1);
                document.getElementById('dodge-cd').innerText = `(${remain}초)`;
            } else {
                document.getElementById('dodge-cd').innerText = '';
            }
        }

        function updateProjectiles() {
            for (let i = projectiles.length - 1; i >= 0; i--) {
                const p = projectiles[i];
                p.mesh.position.addScaledVector(p.dir, p.speed);
                p.life--;

                let hit = false;

                if (p.owner === 'player') {
                    const dist = p.mesh.position.distanceTo(ai.position);
                    if (dist < p.radius + 0.6) {
                        applyDamageToAI(p.damage);
                        hit = true;
                    }
                } else if (p.owner === 'ai') {
                    const dist = p.mesh.position.distanceTo(player.position);
                    if (dist < p.radius + 0.6 && !isInvincible) {
                        applyDamageToPlayer(p.damage);
                        hit = true;
                    }
                }

                if (hit || p.life <= 0 || Math.abs(p.mesh.position.x) > 20 || Math.abs(p.mesh.position.z) > 20) {
                    scene.remove(p.mesh);
                    projectiles.splice(i, 1);
                }
            }
        }

        function updatePlayer() {
            if (isGameOver) return;

            updateCooldowns();

            const speed = 0.15;
            let moveX = 0, moveZ = 0;

            if (keys['ArrowUp']) moveZ -= 1;
            if (keys['ArrowDown']) moveZ += 1;
            if (keys['ArrowLeft']) moveX -= 1;
            if (keys['ArrowRight']) moveX += 1;

            let isMoving = (moveX !== 0 || moveZ !== 0);
            let moveDir = new THREE.Vector3(moveX, 0, moveZ).normalize();

            const shiftPressed = keys['ShiftLeft'] || keys['ShiftRight'];
            const spacePressed = keys['Space'];

            // 1. 회피 (Shift)
            if (shiftPressed && !shiftPressedLastFrame && dodgeTimestamps.length < 2 && !isDodging) {
                isDodging = true;
                dodgeTimer = 15;
                isInvincible = true;
                dodgeDir = isMoving ? moveDir : getPlayerForward();
                dodgeTimestamps.push(Date.now());
            }
            shiftPressedLastFrame = shiftPressed;

            if (isDodging) {
                player.position.x += dodgeDir.x * 0.35;
                player.position.z += dodgeDir.z * 0.35;
                player.userData.bodyMesh.rotation.x += 0.4;

                dodgeTimer--;
                if (dodgeTimer <= 0) {
                    isDodging = false;
                    isInvincible = false;
                    player.userData.bodyMesh.rotation.set(0, 0, 0);
                }
            } else if (isMoving) {
                player.position.x += moveDir.x * speed;
                player.position.z += moveDir.z * speed;
            }

            // 시선 처리: 회피 중이 아닐 때 항시 상대를 바라보도록 고정
            if (!isDodging) {
                const dirToAI = getDirToTarget();
                player.rotation.y = Math.atan2(dirToAI.x, dirToAI.z);
            }

            // 2. 점프 (Space)
            if (spacePressed && !spacePressedLastFrame && jumpTimestamps.length < 2) {
                isJumping = true;
                playerVelocityY = 0.22;
                jumpTimestamps.push(Date.now());
            }
            spacePressedLastFrame = spacePressed;

            if (isJumping) {
                player.position.y += playerVelocityY;
                playerVelocityY -= 0.012;

                if (player.position.y <= 0) {
                    player.position.y = 0;
                    isJumping = false;
                    playerVelocityY = 0;
                }
            } else {
                player.position.y = 0;
            }

            player.position.x = Math.max(-19, Math.min(19, player.position.x));
            player.position.z = Math.max(-19, Math.min(19, player.position.z));

            // 3. [Q] 근접 공격
            if (keys['KeyQ'] && meleeCooldown <= 0 && !isDodging) {
                meleeCooldown = 20;
                player.userData.swordGroup.rotation.x = -Math.PI / 2;

                const dist = player.position.distanceTo(ai.position);
                if (dist < 2.5) {
                    applyDamageToAI(15);
                }
            }

            if (meleeCooldown > 0) {
                meleeCooldown--;
                if (meleeCooldown < 10) {
                    player.userData.swordGroup.rotation.x = Math.PI / 4;
                }
            }

            // 4. [WASD] 투사체 발사
            if (skillCooldown <= 0 && !isDodging) {
                if (keys['KeyW']) triggerProjectileSkill('W');
                else if (keys['KeyA']) triggerProjectileSkill('A');
                else if (keys['KeyS']) triggerProjectileSkill('S');
                else if (keys['KeyD']) triggerProjectileSkill('D');
            }

            if (skillCooldown > 0) skillCooldown--;

            // 3인칭 카메라
            const cameraHeight = 6.0;
            const cameraDistance = 9.0;
            camera.position.set(
                player.position.x,
                player.position.y + cameraHeight,
                player.position.z + cameraDistance
            );
            camera.lookAt(player.position.x, player.position.y + 1.2, player.position.z);
        }

        function triggerProjectileSkill(type) {
            const targetDir = getDirToTarget();

            if (type === 'W') { // 파이어볼
                skillCooldown = 15;
                spawnProjectile(player.position, targetDir, 0.45, 0.3, 0xffa500, 15, 'player');
            } 
            else if (type === 'A') { // 3방향 확산탄
                skillCooldown = 25;
                const leftDir = targetDir.clone().applyAxisAngle(new THREE.Vector3(0, 1, 0), 0.3);
                const rightDir = targetDir.clone().applyAxisAngle(new THREE.Vector3(0, 1, 0), -0.3);

                spawnProjectile(player.position, targetDir, 0.35, 0.25, 0x00ffff, 10, 'player');
                spawnProjectile(player.position, leftDir, 0.35, 0.25, 0x00ffff, 10, 'player');
                spawnProjectile(player.position, rightDir, 0.35, 0.25, 0x00ffff, 10, 'player');
            } 
            else if (type === 'S') { // 대형 에너지볼
                skillCooldown = 30;
                spawnProjectile(player.position, targetDir, 0.2, 0.7, 0x9b59b6, 25, 'player');
            } 
            else if (type === 'D') { // 2연사 샷
                skillCooldown = 25;
                spawnProjectile(player.position, targetDir, 0.4, 0.2, 0xffff00, 12, 'player');
                setTimeout(() => {
                    if (!isGameOver) {
                        const newTargetDir = getDirToTarget();
                        spawnProjectile(player.position, newTargetDir, 0.4, 0.2, 0xffff00, 12, 'player');
                    }
                }, 150);
            }
        }

        function applyDamageToAI(amount) {
            aiHP = Math.max(0, aiHP - amount);
            document.getElementById('ai-hp').style.width = aiHP + '%';
            if (aiHP <= 0) endGame('플레이어 승리!');
        }

        function applyDamageToPlayer(amount) {
            playerHP = Math.max(0, playerHP - amount);
            document.getElementById('player-hp').style.width = playerHP + '%';
            if (playerHP <= 0) endGame('AI 승리!');
        }

        function updateAI() {
            if (isGameOver) return;

            const dist = ai.position.distanceTo(player.position);
            const aiSpeed = 0.08;

            const dir = new THREE.Vector3().subVectors(player.position, ai.position).normalize();
            ai.rotation.y = Math.atan2(dir.x, dir.z);

            if (dist > 2.0) {
                ai.position.x += dir.x * aiSpeed;
                ai.position.z += dir.z * aiSpeed;
            } else {
                if (aiAttackCooldown <= 0) {
                    aiAttacking = true;
                    aiAttackCooldown = 35;
                }
            }

            if (aiAttackCooldown > 0) {
                aiAttackCooldown--;
                if (aiAttackCooldown > 18) {
                    ai.userData.swordGroup.rotation.x = -Math.PI / 2;
                } else {
                    ai.userData.swordGroup.rotation.x = Math.PI / 4;
                    aiAttacking = false;
                }
            }

            if (aiAttacking && aiAttackCooldown === 22) {
                if (dist < 2.5 && !isInvincible) {
                    applyDamageToPlayer(10);
                }
            }
        }

        function endGame(message) {
            isGameOver = true;
            document.getElementById('result-text').innerText = message;
            document.getElementById('game-over').style.display = 'block';
        }

        function resetGame() {
            playerHP = 100;
            aiHP = 100;
            document.getElementById('player-hp').style.width = '100%';
            document.getElementById('ai-hp').style.width = '100%';
            document.getElementById('game-over').style.display = 'none';

            player.position.set(0, 0, 10);
            ai.position.set(0, 0, -10);

            isJumping = false;
            isDodging = false;
            isInvincible = false;
            isGameOver = false;

            projectiles.forEach(p => scene.remove(p.mesh));
            projectiles = [];

            jumpTimestamps = [];
            dodgeTimestamps = [];
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            updatePlayer();
            updateAI();
            updateProjectiles();
            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
</html>
